app-id: io.github.Daniel_v8.Ohmega
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk

command: loudless

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home

modules:
  - name: python3-PyQt6-sip
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="." --prefix=/app PyQt6-sip
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/95/cb/116f9b328636765f3bce97d9e10ec041c54bbe92beb0617edb86c2b615c1/pyqt6_sip-13.11.1-cp312-cp312-manylinux1_x86_64.manylinux_2_5_x86_64.whl
        sha256: 0df15849946cea969d3ff2b24b76149262b6044aea2c5403e4f70c24c973a4c8
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/1b/be/fe2321285e8f683e705d199dbb458131f1850dc5966155a19c40100c85bb/pyqt6_sip-13.11.1-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
        sha256: c52b2b27fc77d9447a8dc1c6de1aaccc22d41e48697aafb2f2f20b8984bb02a5
        only-arches: [aarch64]

  - name: python3-PyQt6-Qt6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="." --prefix=/app PyQt6-Qt6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/e1/be/21d0df9bde717131f4245f8801676120d466afe198c4641c9e4982cf85fe/pyqt6_qt6-6.11.1-py3-none-manylinux_2_34_x86_64.whl
        sha256: 254af349e0ef4b2fa581f86ee9d65eb797bb1d4f0c01ae5ceaa7b2446b458be9
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/08/69/f6b9cafceed9790c62a7ca3044562d38545bbfcfaf222846482ac2f9bd56/pyqt6_qt6-6.11.1-py3-none-manylinux_2_39_aarch64.whl
        sha256: 039b1ab619d63d06a87cacf84b581a2b61a30c9ad5bb677553e738afe4dc433a
        only-arches: [aarch64]

  - name: python3-PyQt6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="." --prefix=/app PyQt6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c3/a0/bd1399740dfa80c0a94d20b02d89962a31458233dcf70eaa09bfbccf3d0f/pyqt6-6.11.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 8555277989fa7d114cb3c3443fd261d566909f7268ceedd41d93a5f02d37ec05
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/d3/db/425b184ac2430ba1978bb507ffd285ec007a872644e2ae5df13332dbcb05/pyqt6-6.11.0-cp310-abi3-manylinux_2_39_aarch64.whl
        sha256: 0734959955adde095af9a074213a7f73386d1bbbddfc27346b4c0621641a692e
        only-arches: [aarch64]

  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="." --prefix=/app mutagen
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b0/7a/620f945b96be1f6ee357d211d5bf74ab1b7fe72a9f1525aafbfe3aee6875/mutagen-1.47.0-py3-none-any.whl
        sha256: edd96f50c5907a9539d8e5bba7245f62c9f520aef333d13392a79a4f70aca719

  - name: ohmega
    buildsystem: simple
    build-commands:
      - install -Dm644 main.py /app/share/loudless/main.py
      - install -Dm644 ohmega.png /app/share/loudless/ohmega.png
      - install -Dm644 ohmega-512.png /app/share/icons/hicolor/512x512/apps/io.github.Daniel_v8.Ohmega.png
      - install -Dm644 flatpak/io.github.Daniel_v8.Ohmega.desktop /app/share/applications/io.github.Daniel_v8.Ohmega.desktop
      - install -Dm644 flatpak/io.github.Daniel_v8.Ohmega.metainfo.xml /app/share/metainfo/io.github.Daniel_v8.Ohmega.metainfo.xml
      - install -Dm755 flatpak/loudless-launch.sh /app/bin/loudless
    sources:
      - type: git
        url: https://github.com/Daniel-v8/Ohmega.git
        tag: v1.1.1
        commit: e7bfdd4a8c40cbcad8aaf3d5f2cd4f3fca98a4bf
